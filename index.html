<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Transport Town – English at the Bus Terminal</title>
<style>
:root{--wood:#8a5a2b;--panel:#f1d9a0;--ink:#3b2412;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#2f4f2f;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
body{min-height:100vh;display:flex;justify-content:center}
#wrap{width:min(100vw,1100px,max(320px,calc((100vh - 320px)*1.6667)));padding:6px 0}
.panel{background:var(--panel);border:4px solid var(--wood);border-radius:8px;box-shadow:inset 0 0 0 2px #c9a05a}
#hud{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:4px 8px;margin-bottom:6px;font-size:13px;font-weight:bold}
#hud .bar{display:inline-block;width:60px;height:8px;background:#7a5a36;border:1px solid var(--ink);border-radius:4px;overflow:hidden;vertical-align:middle}
#hud .bar i{display:block;height:100%;width:0;background:#6fd04a}
#hud .sp{flex:1}
.btn{background:#d9a45b;border:3px solid var(--wood);border-bottom-width:5px;border-radius:6px;padding:5px 10px;font-weight:bold;color:var(--ink);cursor:pointer;font-size:14px;font-family:inherit}
.btn:hover{background:#efbf78}.btn:active{transform:translateY(2px);border-bottom-width:3px}
.btn.sm{padding:2px 8px;font-size:12px;border-bottom-width:4px}
#stage{position:relative;border:4px solid var(--wood);border-radius:4px;background:#000;line-height:0}
canvas{width:100%;display:block;image-rendering:crisp-edges;image-rendering:pixelated}
#prompt{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(30,20,10,.85);color:#ffe9a8;padding:3px 12px;border-radius:12px;font-size:13px;pointer-events:none;line-height:1.3;white-space:nowrap}
#title{position:absolute;inset:0;background:linear-gradient(#7cc4f0,#bfe6a0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;line-height:1.3;text-align:center;padding:10px;overflow:auto}
#title h1{margin:0;font-size:clamp(22px,5vw,42px);color:#3b2412;text-shadow:2px 2px 0 #fff8}
#title p{margin:0;font-size:clamp(12px,2vw,16px)}
#dialog{margin-top:6px;padding:8px 12px;position:relative}
#dlgName{font-weight:bold;font-size:13px;color:#7a4a1c;padding-right:70px}
#dlgText{font-size:clamp(16px,2.4vw,21px);font-weight:bold;margin:4px 0;min-height:28px;line-height:1.3;cursor:pointer}
#dlgId{font-size:14px;background:#fff6d8;border-radius:6px;padding:4px 8px;margin:4px 0;font-style:italic}
#dlgTools{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
#dlgClose{position:absolute;right:8px;top:6px}
.opt{display:block;width:100%;text-align:left;margin:5px 0;font-size:15px}
.opt.good{background:#9bd67a}.opt.bad{background:#e8a09a;opacity:.65;text-decoration:line-through;cursor:default}
.fillp{font-size:16px;margin:6px 0;font-weight:bold}
.fillrow{display:flex;gap:6px}
.fillrow input{flex:1;font-size:16px;padding:6px 8px;border:3px solid var(--wood);border-radius:6px;background:#fffbe9;font-family:inherit;min-width:0}
.fb{margin:8px 0;padding:8px;border-radius:6px;font-size:14px;line-height:1.4}
.fb.ok{background:#d6f0c2;border:2px solid #6aa84f}.fb.no{background:#f9d5d0;border:2px solid #c0564a}.fb.info{background:#fff0b8;border:2px solid #c9a05a}
#touch{display:none;justify-content:space-between;align-items:center;padding:8px 14px;user-select:none;-webkit-user-select:none;touch-action:none}
body.touch #touch{display:flex}body.indlg #touch{display:none!important}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:3px}
.dpad button,.abtn{background:rgba(241,217,160,.9);border:3px solid var(--wood);border-radius:10px;font-size:22px;font-weight:bold;color:var(--ink);touch-action:none}
.abtn{width:74px;height:74px;border-radius:50%;font-size:24px;margin-left:8px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:10px;z-index:10}
#modalBox{max-width:600px;width:100%;max-height:88vh;overflow:auto;padding:14px 18px}
#modalBox h2{margin:0 0 8px}#modalBox h3{margin:14px 0 4px;border-bottom:2px solid var(--wood)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 10px;font-size:14px}
.vgrid span.locked{opacity:.4}
.vgrid button{border:0;background:none;cursor:pointer;font-size:14px}
.small{font-size:12px;opacity:.8}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud" class="panel">
    <span id="hDay">Hari 1 · 06:00</span>
    <span id="hCoin">🪙 0</span>
    <span id="hLv">Lv 1</span><span class="bar"><i id="hXp"></i></span>
    <span id="hTask">Misi 0/3</span>
    <span class="sp"></span>
    <button class="btn sm" id="bJournal">📖 Jurnal (J)</button>
    <button class="btn sm" id="bSound">🔊 Suara</button>
    <button class="btn sm" id="bVoice">🗣 Pilih Suara</button>
    <button class="btn sm" id="bListen">🎧 Listening: OFF</button>
  </div>

  <div id="stage">
    <canvas id="game" width="320" height="192"></canvas>
    <div id="prompt" hidden></div>
    <div id="title">
      <h1>🚌 Transport Town</h1>
      <p><b>English at the Bus Terminal</b></p>
      <p>Jalan: ⬆⬇⬅➡ atau WASD · Bicara: Spasi / E · Jurnal: J</p>
      <button class="btn" id="btnStart">▶ Mulai Baru</button>
      <button class="btn" id="btnContinue" hidden>⏩ Lanjutkan</button>
      <p class="small">Disarankan memakai Chrome/Edge supaya suara bahasa Inggris berfungsi.</p>
      <p class="small">Aset pixel art: Tiny Realm 16x16 oleh Wrabbit (itch.io)</p>
    </div>
  </div>

  <div id="dialog" class="panel" hidden>
    <div id="dlgName"></div>
    <button class="btn sm" id="dlgClose">✖ Tutup</button>
    <div id="dlgText"></div>

    <div id="dlgTools">
      <button class="btn sm" id="btnSpeak">🔊 Dengar</button>
      <button class="btn sm" id="btnTrans">🇮🇩 Terjemahan</button>

  <div id="touch">

      <span></span><button data-k="up">▲</button><span></span>
      <button data-k="left">◀</button><span></span><button data-k="right">▶</button>
      <span></span><button data-k="down">▼</button><span></span>
    </div>
    <div><button class="abtn" id="tJ">📖</button><button class="abtn" id="tA">A</button></div>
  </div>
</div>
<div id="modal" hidden><div id="modalBox" class="panel"></div></div>

<script>
window.addEventListener('DOMContentLoaded',() => {
'use strict';
/* =====================================================================
   1. DATA PEMBELAJARAN  ← BAGIAN INI YANG ANDA EDIT UNTUK MENGGANTI ISI
   ---------------------------------------------------------------------
   - VOCAB   : kamus kata (Inggris -> Indonesia)
   - NPCS    : tokoh, posisi, dan daftar misi (scenarios)
   Jenis langkah (step):
     type "choice": pilihan ganda. Tandai satu jawaban ok:true, lainnya ok:false + why (alasan salah)
     type "fill"  : isian singkat. answers = daftar jawaban yang diterima
   ===================================================================== */
const VOCAB = {
  "one-way ticket":"tiket sekali jalan", "fare":"tarif / ongkos", "window seat":"kursi dekat jendela",
  "aisle seat":"kursi dekat lorong", "depart":"berangkat", "platform":"peron",
  "delay":"keterlambatan / tertunda", "waiting room":"ruang tunggu", "refund":"pengembalian uang",
  "go straight":"jalan lurus", "turn left":"belok kiri", "journey":"perjalanan",
  "bus stop":"halte bus", "arrive":"tiba", "every hour":"setiap jam", "ticket office":"loket tiket",
  "board":"naik (ke kendaraan)", "luggage compartment":"bagasi", "fasten":"memasang / mengencangkan",
  "seat belt":"sabuk pengaman", "traffic jam":"kemacetan", "get off":"turun (dari kendaraan)", "press":"menekan"
};

const NPCS = [
  {
    id:"officer", name:"Mr. Budi", role:"Ticket Officer", spawn:[521,258], sheet:"budi", dir:"down",
    doneLine:{say:"See you tomorrow! Have a nice day.", id:"Sampai besok! Semoga harimu menyenangkan."},
    scenarios:[
      { title:"Buying a ticket",
        steps:[
          { type:"choice", say:"Good morning! How can I help you?", id:"Selamat pagi! Ada yang bisa saya bantu?",
            options:[
              {t:"I'd like a one-way ticket to Bandung, please.", ok:true},
              {t:"Me want ticket Bandung.", ok:false, why:"Kalimatnya tidak lengkap dan kurang sopan. Pola sopan: I'd like ..., please."},
              {t:"Give me ticket Bandung now.", ok:false, why:"Terdengar kasar. Saat membeli tiket pakai: I'd like ..., please."}],
            ok_id:"Saya mau satu tiket sekali jalan ke Bandung, tolong.", vocab:["one-way ticket"] },
          { type:"choice", say:"Sure. The fare is 85,000 rupiah. Would you like a window seat or an aisle seat?", id:"Baik. Tarifnya 85.000 rupiah. Mau kursi dekat jendela atau dekat lorong?",
            options:[
              {t:"A window seat, please.", ok:true},
              {t:"Yes, I like.", ok:false, why:"Pertanyaannya meminta memilih (window atau aisle), jadi sebutkan pilihanmu, bukan 'Yes'."},
              {t:"I am seat.", ok:false, why:"'I am seat' tidak bermakna. Sebutkan jenis kursi yang kamu mau."}],
            ok_id:"Kursi dekat jendela, tolong.", vocab:["fare","window seat","aisle seat"] },
          { type:"fill", say:"Here is your ticket. Your bus departs at 9:30 from Platform 3.", id:"Ini tiketmu. Busmu berangkat pukul 9.30 dari Peron 3.",
            prompt:"Isi kata yang hilang:  The bus departs ____ Platform 3.", answers:["from"],
            why:"Kita memakai 'depart from' untuk tempat keberangkatan.", vocab:["depart","platform"] }
        ],
        end:{say:"Have a safe trip!", id:"Selamat jalan, hati-hati di perjalanan!"} },
      { title:"A delayed bus",
        steps:[
          { type:"choice", say:"I'm sorry. The ten o'clock bus is delayed by thirty minutes.", id:"Maaf. Bus pukul sepuluh tertunda tiga puluh menit.",
            options:[
              {t:"What time will it leave, then?", ok:true},
              {t:"Why you are late?", ok:false, why:"Susunan kalimat tanya salah dan menyalahkan petugas. Bentuk benar: Why is it late?"},
              {t:"Delayed is bad.", ok:false, why:"Kalimat ini tidak menanyakan informasi yang kamu butuhkan."}],
            ok_id:"Kalau begitu, jam berapa busnya berangkat?", vocab:["delay"] },
          { type:"choice", say:"It will leave at ten thirty. I'm very sorry for the inconvenience.", id:"Berangkat pukul 10.30. Mohon maaf atas ketidaknyamanannya.",
            options:[
              {t:"Could I wait in the waiting room?", ok:true},
              {t:"Where waiting room is?", ok:false, why:"Urutan kata tanya salah. Bentuk benar: Where is the waiting room?"},
              {t:"I waiting in room wait.", ok:false, why:"Kalimat ini tidak gramatikal. Untuk meminta izin pakai: Could I ...?"}],
            ok_id:"Bolehkah saya menunggu di ruang tunggu?", vocab:["waiting room"] },
          { type:"fill", say:"Of course. And if you prefer, you can get your money back.", id:"Tentu. Dan kalau mau, uangmu bisa dikembalikan.",
            prompt:"Ketik kata yang hilang:  Can I get a ____ for my ticket? (pengembalian uang)", answers:["refund"],
            why:"Refund = pengembalian uang.", vocab:["refund"] }
        ],
        end:{say:"No problem. Thank you for your patience.", id:"Tidak masalah. Terima kasih atas kesabarannya."} }
    ]
  },
  {
    id:"sarah", name:"Sarah", role:"Tourist", spawn:[280,300], sheet:"char2", dir:"down", suitcase:true,
    doneLine:{say:"Thanks again! See you around.", id:"Terima kasih lagi! Sampai jumpa."},
    scenarios:[
      { title:"Giving directions",
        steps:[
          { type:"choice", say:"Excuse me! Could you tell me where the waiting room is?", id:"Permisi! Bisakah kamu memberi tahu di mana ruang tunggunya?",
            options:[
              {t:"Go straight, then turn left. It's next to the ticket office.", ok:true},
              {t:"You go straight then turn left it is next the ticket.", ok:false, why:"Kurang kata penghubung dan kurang 'to': next to the ticket office."},
              {t:"Waiting room is no here.", ok:false, why:"Pertanyaannya meminta arah. Dan bentuk negatif yang benar: It isn't here."}],
            ok_id:"Jalan lurus, lalu belok kiri. Letaknya di sebelah loket tiket.", vocab:["go straight","turn left","waiting room"] },
          { type:"choice", say:"Thank you! How long is the journey to Bandung by bus?", id:"Terima kasih! Berapa lama perjalanan ke Bandung naik bus?",
            options:[
              {t:"It takes about three hours.", ok:true},
              {t:"It takes three hour.", ok:false, why:"Setelah angka lebih dari satu, kata benda jamak: three hours."},
              {t:"It is three hours long distance.", ok:false, why:"Tidak natural. Untuk durasi perjalanan gunakan: It takes ..."}],
            ok_id:"Perjalanannya sekitar tiga jam.", vocab:["journey"] },
          { type:"choice", say:"Great! Thank you so much for your help.", id:"Bagus! Terima kasih banyak atas bantuanmu.",
            options:[
              {t:"You're welcome. Have a safe trip!", ok:true},
              {t:"Welcome you. Goodbye you.", ok:false, why:"Balasan terima kasih yang benar: You're welcome."},
              {t:"No thank.", ok:false, why:"Tidak natural. Balasan sopan: You're welcome."}],
            ok_id:"Sama-sama. Semoga perjalananmu aman!", vocab:[] }
        ],
        end:{say:"Goodbye! See you around.", id:"Sampai jumpa!"} },
      { title:"At the bus stop",
        steps:[
          { type:"choice", say:"Excuse me. Is this bus stop for the Bandung bus?", id:"Permisi. Apakah halte ini untuk bus ke Bandung?",
            options:[
              {t:"Yes, it is. The bus arrives at ten o'clock.", ok:true},
              {t:"Yes, it are. Bus arrive ten o'clock.", ok:false, why:"'it' berpasangan dengan 'is', dan subjek tunggal: the bus arrives."},
              {t:"No, I am not bus.", ok:false, why:"Pertanyaannya tentang halte. Jawab: Yes, it is. / No, it isn't."}],
            ok_id:"Ya, benar. Busnya tiba pukul sepuluh.", vocab:["bus stop","arrive"] },
          { type:"choice", say:"Thank you. Is there a bus to Bandung every hour?", id:"Terima kasih. Apakah ada bus ke Bandung setiap jam?",
            options:[
              {t:"Yes, there is a bus every hour.", ok:true},
              {t:"Yes, have bus every hour.", ok:false, why:"Untuk menyatakan sesuatu ada, gunakan 'there is / there are'."},
              {t:"Yes, every hour is bus.", ok:false, why:"Susunan kata tidak natural. Pakai: There is a bus every hour."}],
            ok_id:"Ya, ada bus setiap jam.", vocab:["every hour"] },
          { type:"fill", say:"Great! Where can I buy a ticket?", id:"Bagus! Di mana saya bisa membeli tiket?",
            prompt:"Isi kata yang hilang:  You can buy a ticket at the ticket ____ .  (loket)", answers:["office","booth","counter"],
            why:"Loket tiket = ticket office / ticket booth / ticket counter.", vocab:["ticket office"] }
        ],
        end:{say:"Thanks a lot!", id:"Terima kasih banyak!"} }
    ]
  },
  {
    id:"joko", name:"Pak Joko", role:"Bus Driver", spawn:[490,381], sheet:"joko", dir:"left",
    doneLine:{say:"Drive safe, my friend! See you tomorrow.", id:"Hati-hati di jalan, kawan! Sampai besok."},
    scenarios:[
      { title:"Boarding the bus",
        steps:[
          { type:"choice", say:"Good morning! Please show your ticket before boarding.", id:"Selamat pagi! Tolong tunjukkan tiketmu sebelum naik.",
            options:[
              {t:"Here is my ticket.", ok:true},
              {t:"I show you ticket.", ok:false, why:"Respons natural: Here is my ticket. / Here you are."},
              {t:"Ticket is no.", ok:false, why:"Kalimat ini tidak bermakna. Gunakan: Here is my ticket."}],
            ok_id:"Ini tiket saya.", vocab:["board"] },
          { type:"choice", say:"Thank you. You can put your big bag in the luggage compartment.", id:"Terima kasih. Tas besar bisa ditaruh di bagasi.",
            options:[
              {t:"Where is the luggage compartment?", ok:true},
              {t:"Where the compartment luggage is?", ok:false, why:"Urutan kata salah. Bentuk benar: Where is the luggage compartment?"},
              {t:"The luggage is where compartment?", ok:false, why:"Urutan kata tanya salah. Kata tanya 'Where' di awal."}],
            ok_id:"Di mana bagasinya?", vocab:["luggage compartment"] },
          { type:"fill", say:"It's under the bus, on the right side. Before we leave, please fasten your seat belt.", id:"Ada di bawah bus, sisi kanan. Sebelum berangkat, tolong pasang sabuk pengamanmu.",
            prompt:"Isi kata yang hilang:  Please ____ your seat belt.  (memasang)", answers:["fasten","buckle"],
            why:"Fasten your seat belt = pasang sabuk pengaman.", vocab:["fasten","seat belt"] }
        ],
        end:{say:"Thank you. Enjoy the ride!", id:"Terima kasih. Selamat menikmati perjalanan!"} },
      { title:"A traffic jam", onBus:true,
        steps:[
          { type:"choice", say:"Ladies and gentlemen, we are stuck in a traffic jam. We will be about twenty minutes late.", id:"Para penumpang, kita terjebak macet. Kita akan terlambat sekitar dua puluh menit.",
            options:[
              {t:"That's okay. Thank you for telling us.", ok:true},
              {t:"You is late. Bad driver.", ok:false, why:"Tidak sopan dan grammar salah ('You are', bukan 'You is')."},
              {t:"Late twenty minute okay.", ok:false, why:"Kalimat tidak lengkap, dan 'minute' harus jamak: twenty minutes."}],
            ok_id:"Tidak apa-apa. Terima kasih sudah memberi tahu kami.", vocab:["traffic jam"] },
          { type:"choice", say:"Does anyone need to get off at the next stop?", id:"Adakah yang perlu turun di pemberhentian berikutnya?",
            options:[
              {t:"Yes, I need to get off at Cimahi.", ok:true},
              {t:"Yes, I need get off in Cimahi stop.", ok:false, why:"Setelah 'need' pakai 'to': need to get off. Dan 'at' untuk titik pemberhentian."},
              {t:"I off Cimahi.", ok:false, why:"Kalimat tidak lengkap. Gunakan: I need to get off at ..."}],
            ok_id:"Ya, saya perlu turun di Cimahi.", vocab:["get off"] },
          { type:"fill", say:"Okay. Please push the button before your stop.", id:"Baik. Tolong tekan tombolnya sebelum pemberhentianmu.",
            prompt:"Isi kata yang hilang:  Please ____ the stop button.  (menekan)", answers:["press","push"],
            why:"press / push the button = tekan tombol.", vocab:["press"] }
        ],
        end:{say:"Thanks for being patient!", id:"Terima kasih atas kesabarannya!"} }
    ]
  }
];

/* =====================================================================
   2. PERALATAN KECIL
   ===================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const lerp = (a,b,t) => a+(b-a)*t;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.round(r*f);g=Math.round(g*f);b=Math.round(b*f);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function px(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h);}
const fmtTime = m => {const h=Math.floor(m/60),mm=Math.floor(m%60/10)*10;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');};

/* =====================================================================
   3. STATUS PERMAINAN + SIMPAN
   ===================================================================== */
const SAVE_KEY = 'transporttown_v1';
function newState(){return {day:1,coins:0,xp:0,level:1,vocab:[],doneCount:{},doneToday:{},stats:{attempts:0,steps:0,firstTry:0}};}
let S = newState();
let minutes = 360;            // jam dalam game (menit sejak 00:00)
let mode = 'title';           // title | play | dialog | modal
function loadSave(){try{const j=localStorage.getItem(SAVE_KEY);if(j)return Object.assign(newState(),JSON.parse(j));}catch(e){}return null;}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
const xpNeeded = lv => 50+25*(lv-1);

/* =====================================================================
   4. SUARA (efek + suara bahasa Inggris dari browser)
   ===================================================================== */
let soundOn = true, listening = false, AC = null;
const ttsOK = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let voices = [];
if (ttsOK) {const lv=()=>{voices=speechSynthesis.getVoices();};lv();speechSynthesis.onvoiceschanged=lv;}
const AUDIO_DIR='audio/';
let curAudio=null,voicePick='';
try{voicePick=localStorage.getItem('tt_voice')||'';}catch(e){}
function stopSpeech(){
  try{if(curAudio){curAudio.onended=curAudio.onerror=null;curAudio.pause();curAudio=null;}}catch(e){}
  if(ttsOK)try{speechSynthesis.cancel();}catch(e){}
}
function pickVoice(){
  if(voicePick){const v=voices.find(v=>v.voiceURI===voicePick||v.name===voicePick);if(v)return v;}
  const en=voices.filter(v=>/^en/i.test(v.lang));
  const score=v=>(/natural|online|neural/i.test(v.name)?4:0)+(/google/i.test(v.name)?2:0)+(/^en[-_]US/i.test(v.lang)?1:0);
  return en.sort((a,b)=>score(b)-score(a))[0]||null;
}
function speakTTS(text){
  if(!ttsOK)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';u.rate=0.9;
    const v=pickVoice();if(v){u.voice=v;u.lang=v.lang;}
    speechSynthesis.speak(u);
  }catch(e){}
}
/* speak(text, key): putar rekaman audio/<key>.mp3 kalau ada; kalau tidak ada/gagal -> suara browser */
function speak(text,key){
  stopSpeech();
  if(!key){speakTTS(text);return;}
  try{
    const a=new Audio(AUDIO_DIR+key+'.mp3');curAudio=a;
    let fell=false;
    const fb=()=>{if(fell||curAudio!==a)return;fell=true;curAudio=null;speakTTS(text);};
    a.onerror=fb;
    const pr=a.play();
    if(pr&&pr.catch)pr.catch(fb);
  }catch(e){speakTTS(text);}
}
function beep(f,d,type,vol,delay){
  if(!soundOn)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+(delay||0);
    o.type=type||'square';o.frequency.value=f;
    g.gain.setValueAtTime(vol||0.04,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+0.02);
  }catch(e){}
}

function same(g,x,y){if(!inB(x,y))return true;const q=ground[y][x];return g===WATER?q===WATER:(q===DIRT||q===ROAD);}
function edgesOf(x,y){const g=ground[y][x];return{n:!same(g,x,y-1),s:!same(g,x,y+1),w:!same(g,x-1,y),e:!same(g,x+1,y)};}
function ringTile(g,ed){
  if(!ed.n&&!ed.s&&!ed.w&&!ed.e)return g===WATER?[9,1]:[0,0];
  const o=g===WATER?10:1;
  return [o+(ed.w?0:(ed.e?2:1)),(ed.n?0:(ed.s?2:1))];
}

const staticLayer=document.createElement('canvas');staticLayer.width=MW*T;staticLayer.height=MH*T;

  const c=staticLayer.getContext('2d');c.imageSmoothingEnabled=false;const r=rng(77);

    const X=x*T,Y=y*T,q=r();
    tl(c,q<.88?7:8,0,X,Y);
    if(q>=.94)tl(c,0,3,X,Y);
    const g=ground[y][x];
    if(g===DIRT){const e=edgesOf(x,y),t=ringTile(DIRT,e);tl(c,t[0],t[1],X,Y);if(isStone[y][x])tl(c,0,4,X,Y);}
    else if(g===ROAD){
      tl(c,0,5,X,Y);
      if(y===25)px(c,X,Y,T,1,'#9a6038');
      if(y===26&&x%2===0)px(c,X+3,Y+7,10,2,'#f2d0a0');
    }else if(g===WATER){
      const e=edgesOf(x,y);
      if(e.n||e.s||e.w||e.e){const t=ringTile(WATER,e);tl(c,t[0],t[1],X,Y);}else waterTiles.push([x,y]);
    }
  }
  /* bunga kecil di rumput */
  const tiny=['tiny1','tiny2','tiny3'];
  for(let i=0;i<150;i++){
    const x=2+Math.floor(r()*40),y=4+Math.floor(r()*21);

}

function collides(x,y){
  const pts=[[x-4,y-3],[x+4,y-3],[x-4,y],[x+4,y]];
  for(const [a,b] of pts){const tx=Math.floor(a/T),ty=Math.floor(b/T);if(tx<0||ty<0||tx>=MW||ty>=MH||blocked[ty][tx])return true;}
  for(const n of npcs)if(Math.hypot(x-n.x,y-n.y)<9)return true;
  return false;
}
function softBlocked(x,y){const tx=Math.floor(x/T),ty=Math.floor(y/T);return tx<2||ty<5||tx>=MW-2||ty>=24||blocked[ty][tx]||ground[ty][tx]!==GRASS;}
function updateSlime(dt){
  slime.timer-=dt;
  if(slime.timer<=0){
    if(slime.moving){slime.moving=false;slime.timer=1.5+Math.random()*3;}
    else{
      const a=Math.random()*6.283,d=20+Math.random()*30;
      const tx=clamp(slime.x+Math.cos(a)*d,150,330),ty=clamp(slime.y+Math.sin(a)*d,230,350);
      if(!softBlocked(tx,ty)){slime.tx=tx;slime.ty=ty;slime.moving=true;slime.timer=3;}else slime.timer=.5;
    }
  }
  if(slime.moving){
    const dx=slime.tx-slime.x,dy=slime.ty-slime.y,d=Math.hypot(dx,dy);
    if(d<1.5){slime.moving=false;slime.timer=1.5+Math.random()*3;}
    else{const sp=16*dt;slime.x+=dx/d*sp;slime.y+=dy/d*sp;slime.dir=dx<0?'left':'right';}
  }
}
function updateBus(dt){
  if(bus.state==='wait'){bus.timer-=dt;if(bus.timer<=0){bus.state='in';bus.x=-64;}}
  else if(bus.state==='in'){const dist=STOPX-bus.x;bus.speed=Math.max(8,Math.min(60,dist*1.2));bus.x+=bus.speed*dt;if(dist<=1){bus.x=STOPX;bus.speed=0;bus.state='stop';bus.timer=8;}}
  else if(bus.state==='stop'){bus.timer-=dt;if(bus.timer<=0){bus.state='out';bus.speed=0;}}
  else{bus.speed=Math.min(70,bus.speed+40*dt);bus.x+=bus.speed*dt;if(bus.x>MW*T+10){bus.state='wait';bus.timer=10;}}
  bus.wheel+=bus.speed*dt*0.4;
}

function renderStep(){
  const st=dlg.sc.steps[dlg.i];dlg.tries=0;setName();showLine(st.say,st.id,dlg.npc.data.id+'_s'+(dlg.sc.n)+'_'+(dlg.i+1));dlgBody.innerHTML='';
  if(st.type==='fill'){
    dlgBody.appendChild(el('div','fillp',st.prompt));
    const row=el('div','fillrow'),inp=el('input');inp.type='text';inp.placeholder='Ketik jawabanmu…';inp.autocomplete='off';inp.autocapitalize='off';inp.spellcheck=false;
    const bt=el('button','btn','Cek ✔');row.append(inp,bt);dlgBody.appendChild(row);
    const submit=()=>{const v=inp.value.trim().toLowerCase().replace(/[^a-z' -]/g,'');if(!v)return;checkFill(st,v,inp,bt);};
    bt.onclick=submit;inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}});
    setTimeout(()=>inp.focus(),50);
  }else{

function rewards(xp,coins){
  S.xp+=xp;S.coins+=coins;let up=false;
  while(S.xp>=xpNeeded(S.level)){S.xp-=xpNeeded(S.level);S.level++;up=true;}
  return up;
}
function collect(list){const nw=[];(list||[]).forEach(w=>{if(!S.vocab.includes(w)){S.vocab.push(w);nw.push(w);}});return nw;}
function solved(st,gaveUp,extra){
  reveal();
  S.stats.steps++;
  const first=dlg.tries===0&&!gaveUp;
  if(first)S.stats.firstTry++;
  const xp=gaveUp?0:(first?10:5),coins=gaveUp?0:(first?5:2);
  const up=rewards(xp,coins);
  const nw=collect(st.vocab);
  let h=gaveUp?'📝 Jawabannya sudah ditampilkan. Coba ingat untuk lain kali.':(first?'✅ <b>Benar!</b> Langsung tepat, mantap!':'✅ <b>Benar!</b>');
  if(extra)h+='<br>'+extra;
  if(xp)h+=`<br>+${xp} XP · +${coins} 🪙`;
  if(nw.length)h+='<br>📘 Kata baru: '+nw.map(w=>`<b>${esc(w)}</b> = ${esc(VOCAB[w])}`).join('; ');
  if(up)h+=`<br>🎉 <b>Naik ke Level ${S.level}!</b>`;
  feedback('ok',h);
  (up?sfx.level:sfx.ok)();
  fxReward(xp,coins,up);
  save();updateHUD();
  const last=dlg.i>=dlg.sc.steps.length-1;
  addBtn(last?'Lanjut ▶':'Lanjut ▶',()=>{if(last)finishScenario();else{dlg.i++;renderStep();}},'btnNext');
}
function checkChoice(st,o,btn){
  S.stats.attempts++;
  if(o.ok){
    dlgBody.querySelectorAll('.opt').forEach(b=>b.disabled=true);btn.classList.add('good');
    solved(st,false,'Artinya: <i>'+esc(st.ok_id)+'</i>');
  }else{
    dlg.tries++;btn.disabled=true;btn.classList.add('bad');sfx.bad();
    feedback('no','❌ <b>Belum tepat.</b> '+esc(o.why));
  }
}
function checkFill(st,v,inp,bt){
  S.stats.attempts++;
  if(st.answers.includes(v)){
    inp.disabled=true;bt.disabled=true;solved(st,false,'Penjelasan: '+esc(st.why));
  }else{
    dlg.tries++;sfx.bad();inp.value='';inp.focus();
    if(dlg.tries>=3){
      inp.disabled=true;bt.disabled=true;
      solved(st,true,'Jawaban: <b>'+esc(st.answers[0])+'</b>. '+esc(st.why));
    }else if(dlg.tries===1){feedback('no','❌ <b>Belum tepat.</b> Coba lagi.');}
    else{const a=st.answers[0];feedback('no',`❌ <b>Belum tepat.</b> Petunjuk: ${a.length} huruf, dimulai dengan "<b>${esc(a[0])}</b>".`);}
  }
}
function finishScenario(){
  const n=dlg.npc.data,sc=dlg.sc,scN=sc.n;

}

  spr(c,'dock',112-cx,256-cy);
  /* benda + tokoh diurutkan berdasarkan kedalaman */
  const items=objs.map(o=>({y:o.y,f:()=>drawObj(c,o,cx,cy,t)}));
  npcs.forEach(n=>items.push({y:n.y,f:()=>{
    drawChar(c,IMG[n.sheet],n.x-cx,n.y-cy,n.dir,false,t,n.phase);
    if(n.data.suitcase)drawSuitcase(c,n.x-cx+12,n.y-cy);
  }}));
  items.push({y:slime.y,f:()=>{
    const row=slime.moving?1:0,col=Math.floor(t*(slime.moving?6:3))%4,sx=Math.round(slime.x-cx),sy=Math.round(slime.y-cy);
    if(slime.dir==='left'){c.save();c.translate(sx,0);c.scale(-1,1);c.drawImage(IMG.slime,col*32,row*32,32,32,-16,sy-22,32,32);c.restore();}
    else c.drawImage(IMG.slime,col*32,row*32,32,32,sx-16,sy-22,32,32);
  }});
  items.push({y:player.y,f:()=>drawChar(c,IMG.char1,player.x-cx,player.y-cy,player.dir,player.moving,player.moving?player.anim:t,0)});
  items.sort((a,b)=>a.y-b.y).forEach(i=>i.f());
  drawBus(c,cx,cy);
  /* kupu-kupu (siang hari) */
  if(minutes>480&&minutes<1020)butterflies.forEach(b=>{
    const x=Math.round(b.cx+Math.sin(t*.7+b.ph)*40-cx),y=Math.round(b.cy+Math.cos(t*.9+b.ph*1.3)*18-cy);
    px(c,x,y+1,1,1,'#553');
    if(Math.floor(t*8+b.ph)%2){px(c,x-2,y,2,2,'#ffe066');px(c,x+1,y,2,2,'#ffe066');}else{px(c,x-1,y-1,1,3,'#ffe066');px(c,x+1,y-1,1,3,'#ffe066');}
  });
  /* asap & debu */
  parts.forEach(p=>{
    const a=1-p.life/p.max,x=Math.round(p.x-cx),y=Math.round(p.y-cy);
    if(p.type==='star'){c.globalAlpha=Math.min(1,a*1.5);px(c,x-1,y,3,1,p.col);px(c,x,y-1,1,3,p.col);c.globalAlpha=1;}
    else{const sz=Math.round(p.s0+(1-a)*4);c.globalAlpha=a*(p.type==='dust'?.8:.6);px(c,x-(sz>>1),y-(sz>>1),sz,sz,p.col);c.globalAlpha=1;}
  });
  /* siang-malam */
  const [r,g,b,a]=ambient(minutes);
  if(a>0.005){c.fillStyle=`rgba(${r},${g},${b},${a})`;c.fillRect(0,0,VW,VH);}
  if(minutes>1050){
    const gl=clamp((minutes-1050)/90,0,1);
    c.fillStyle=`rgba(255,215,110,${gl*.85})`;
    WIN_GLOW.forEach(([x,y,w,h])=>c.fillRect(x-cx,y-cy,w,h));
    c.globalCompositeOperation='lighter';
    lamps.forEach(l=>{const lx=l.x+5-cx,ly=l.top+4-cy;
      [[26,.05],[18,.07],[11,.10],[5,.16]].forEach(([rad,al])=>{c.fillStyle=`rgba(255,196,96,${al*gl})`;c.beginPath();c.arc(lx,ly,rad,0,6.283);c.fill();});});
    c.globalCompositeOperation='source-over';
  }
  /* tanda di atas NPC + teks melayang */
  if(mode==='play'||mode==='dialog')npcs.forEach(n=>drawNpcMark(c,n,cx,cy,t));
  c.font='bold 8px monospace';c.textAlign='center';c.textBaseline='alphabetic';c.lineWidth=2;c.strokeStyle='#1b111b';
  floaters.forEach(f=>{const a=Math.min(1,(f.max-f.life)*2);c.globalAlpha=a;const x=Math.round(f.x-cx),y=Math.round(f.y-cy);c.strokeText(f.text,x,y);c.fillStyle=f.col;c.fillText(f.text,x,y);c.globalAlpha=1;});
}
function update(dt){
  T_+=dt;
  updateBus(dt);updateSlime(dt);updateParts(dt);
  npcs.forEach(n=>{
    if(mode==='dialog'&&dlg&&dlg.npc===n)return;
    n.lookTimer-=dt;
    if(n.lookTimer<=0&&n.data.id==='sarah'){n.dir=['down','left','right','down'][Math.floor(Math.random()*4)];n.lookTimer=2+Math.random()*3;}
    else if(n.lookTimer<=0){n.lookTimer=3+Math.random()*3;if(n.data.id==='joko')n.dir=n.dir==='left'?'down':'left';}
  });
  if(mode==='play'){
    minutes+=dt*2;
    let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);
    player.moving=!!(dx||dy);
    if(player.moving){
      const len=Math.hypot(dx,dy),sp=64*dt;dx=dx/len*sp;dy=dy/len*sp;
      if(Math.abs(dx)>Math.abs(dy))player.dir=dx>0?'right':'left';else player.dir=dy>0?'down':'up';
      if(!collides(player.x+dx,player.y))player.x+=dx;
      if(!collides(player.x,player.y+dy))player.y+=dy;
      const st=Math.floor(player.anim*8)%4;
      player.anim+=dt;
      if(Math.floor(player.anim*8)%4!==st&&(st===1||st===3))dust(player.x,player.y);
    }
    const n=nearestNpc(),pr=$('prompt');
    if(n){pr.hidden=false;pr.textContent=(document.body.classList.contains('touch')?'Tekan tombol A':'Tekan Spasi / E')+' untuk bicara dengan '+n.data.name;}
    else pr.hidden=true;
    if(minutes>=1260&&summaryShownDay!==S.day){summaryShownDay=S.day;openDaySummary();}
    updateHUD();
  }else player.moving=false;
}
imgReady.then(()=>{
  buildStatic();assetsReady=true;
  $('btnStart').disabled=false;$('btnContinue').disabled=false;
});
$('btnStart').disabled=true;$('btnContinue').disabled=true;
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);render(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.__tt={get S(){return S;},player,npcs,bus,slime,startGame,newState,openDialog,get mode(){return mode;},set minutes(v){minutes=v;},get minutes(){return minutes;},cam};

});
</script>
